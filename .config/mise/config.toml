[settings]
auto_install = false

[tools]
go = "latest"
node = "latest"
python = "latest"
ruby = "latest"
rust = "latest"

neovim = "nightly"
tree-sitter = "latest" # required for nvim-treesitter (compiling parsers)
usage = "latest" # requirement for some cli tools

dive = "latest"
pipx = "latest"

"aqua:datadog-labs/pup" = "latest"

"pipx:pgcli" = "latest" # NOTE: can't be installed via homebrew as it depends on libpq (and we install postgres via mise)
"github:akitaonrails/ai-jail" = "latest"
"github:JFryy/qq" = "latest" # universal jq-like tool (notably compatible with terraform files)
"github:k1LoW/mo" = "latest" # previewing markdown files

"github:reviewdog/reviewdog" = "latest"
# "go:github.com/reviewdog/reviewdog/cmd/reviewdog" = "latest" # master branch
# "github:reviewdog/nightly" = "latest" # reviewdog nightly repository
